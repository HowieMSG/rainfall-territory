<title>Rainfall Northeast Territory</title>

<style>
:root {
  --color-bg: #F7F8FA; --color-panel: #FFFFFF; --color-fg: #171717; --color-fg-muted: #5D6470; --color-border-line: #E1E5EB;
  --color-ok: #1F8A5B; --color-warn: #B7791F; --color-bad: #C53030;
  --font-anthropic-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-anthropic-serif: "DM Sans", system-ui, sans-serif;
  --cds-font-size-caption: 0.8125rem; --cds-font-size-body: 0.9375rem; --cds-font-size-heading: 1.0625rem; --cds-font-size-title: 1.375rem;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 16px; --cds-pad-lg: 20px; --cds-pad-xl: 32px;
  --cds-radius: 10px; --cds-surface-popover: #FFFFFF; --cds-border: #E1E5EB; --cds-shadow-popover: 0 6px 24px rgba(23,23,23,.12);
  --cds-text-secondary: #5D6470; --cds-chart-grid: #E9ECF1; --cds-chart-axis: #C9CFD8; --cds-chart-muted: #C9CFD8;
}
@media (prefers-color-scheme: dark) { :root {
  --color-bg: #111317; --color-panel: #191C22; --color-fg: #ECEEF2; --color-fg-muted: #9AA3B2; --color-border-line: #2A2F38;
  --cds-surface-popover: #1F232A; --cds-border: #2F3540; --cds-text-secondary: #9AA3B2; --cds-chart-grid: #262B33; --cds-chart-axis: #3A414D; color-scheme: dark;
} }
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 15px; }
#dash-root { padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
.lock-card { width: 100%; max-width: 380px; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgba(23,23,23,.06); }
.lock-word { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
.lock-word span { color: #2B72E6; }
.lock-sub { color: var(--color-fg-muted); font-size: .9rem; line-height: 1.45; margin: 0; }
.lock label { font-size: .85rem; font-weight: 600; }
.lock input { font: inherit; font-size: 1rem; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); }
.lock input:focus { outline: 2px solid #2B72E6; outline-offset: 1px; }
.lock button { font: inherit; font-weight: 600; font-size: 1rem; padding: 11px; border-radius: 8px; border: 0; background: #2B72E6; color: #fff; cursor: pointer; }
.lock button:disabled { opacity: .6; cursor: default; }
.lock .err { color: var(--color-bad); font-size: .85rem; min-height: 1.2em; margin: 0; }
.lock form { display: flex; flex-direction: column; gap: 10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
<div class="lock" id="lock">

    <div class="lock-word">Rainfall <span>Health</span></div>
    <p class="lock-sub">Northeast territory plan prepared by Howie Pollard. Enter the password you were given.</p>
    <form id="lock-form" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">Open the plan</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
</div>
